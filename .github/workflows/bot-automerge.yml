name: bot-automerge (reusable)

# =============================================================================
# TODO(teammate): wire real triggers/classification per issue #264
# -----------------------------------------------------------------------------
# This is a STUB reusable workflow. It establishes the distribution shape (a
# `workflow_call` entry point consumers pin by SHA, a version input bumped in
# lockstep with each release via release-please extra-files, and the install of
# the published `@rmartz/bot-automerge` CLI from GitHub Packages) but does NOT
# yet classify or enable auto-merge. The `enable` job currently only installs the
# CLI and runs `ai-bot-automerge --help` as a placeholder.
#
# When implementing (see rmartz/ai-tools#264):
#   - The caller carries the real triggers a reusable workflow cannot declare
#     (`pull_request` for bot PRs, plus any `workflow_dispatch`), grants the write
#     scopes below, and passes `secrets: inherit`. See docs/consuming.md.
#   - `enable` classifies the PR — Dependabot patch/minor bumps and release-please
#     release PRs are the eligible bot set (docs/bot-automerge-contract.md) — and,
#     when eligible, runs `gh pr merge --auto --squash` to turn on GitHub-native
#     auto-merge. Unlike @rmartz/merge-safety this posts NO check-run.
#
#   jobs:
#     bot-automerge:
#       uses: rmartz/bot-automerge/.github/workflows/bot-automerge.yml@<sha>  # vX.Y.Z
#       with:
#         pr: ${{ github.event.pull_request.number }}
#       secrets: inherit
#
# Dependabot's github-actions ecosystem bumps that <sha> pin via PRs, so updates
# propagate with no per-repo YAML edits. The @rmartz/bot-automerge version this
# workflow installs is bumped in lockstep with each release (release-please
# extra-files), so a pinned ref is fully reproducible.
# =============================================================================

on:
  workflow_call:
    inputs:
      pr:
        description: PR number to classify + enable auto-merge for (threaded from the caller).
        type: string
        required: false
        default: ''
      version:
        description: '@rmartz/bot-automerge version to install (pinned to this release).'
        type: string
        required: false
        default: 0.1.0 # x-release-please-version
      node-version:
        description: Node.js version to run under.
        type: string
        required: false
        default: '22'

permissions:
  contents: write # enable GitHub-native auto-merge on the PR
  pull-requests: write # read PR metadata + turn on auto-merge

concurrency:
  group: bot-automerge-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  enable:
    name: Enable auto-merge for an eligible bot PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://npm.pkg.github.com
          scope: '@rmartz'
      - name: Install ai-bot-automerge
        env:
          # The public @rmartz/bot-automerge package on GitHub Packages is readable
          # with the built-in GITHUB_TOKEN — no consumer PAT required.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install -g "@rmartz/bot-automerge@${{ inputs.version }}"
      # TODO(teammate): replace this placeholder with the real classification +
      # `ai-bot-automerge enable --pr "${PR_NUMBER}"` invocation (issue #264).
      - run: ai-bot-automerge --help
