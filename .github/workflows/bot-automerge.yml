name: bot-automerge (reusable)

# The single entry point consuming repos pin. Unlike a read-only hygiene check, a
# consumer's caller is NOT trigger-free: a reusable workflow cannot declare its own
# `on: pull_request_target`, so the caller carries the trigger, grants the write
# scopes (contents / pull-requests) PLUS `packages: read` (a called workflow is
# capped by its caller, so the caller MUST grant every scope declared below or the
# run fails at startup validation), and passes `secrets: inherit`. The caller is
# otherwise thin — the Dependabot-vs-other branch and the fetch-metadata step live
# here, because a reusable workflow sees the caller's event context. See
# docs/consuming.md.
#
#   jobs:
#     bot-automerge:
#       uses: rmartz/bot-automerge/.github/workflows/bot-automerge.yml@<sha>  # vX.Y.Z
#       with:
#         pr: ${{ github.event.pull_request.number }}
#       secrets: inherit
#
# Dependabot's github-actions ecosystem bumps that <sha> pin via PRs, so updates
# propagate with no per-repo YAML edits. The @rmartz/bot-automerge version this
# workflow installs is NOT written into this file: it is resolved at runtime from
# the release tag (vX.Y.Z) that points at this workflow's own pinned commit
# (job.workflow_sha). So the CLI version is a pure function of the Dependabot-
# managed pin — one bump moves both — and a pinned ref is fully reproducible.
#
# bot-automerge posts NO check-run (unlike @rmartz/merge-safety) and carries no
# fleet check-run contract. It is purely an eligibility ENABLER: the published
# `ai-bot-automerge` CLI fetches the PR, decides eligibility (Dependabot
# patch/minor bumps and release-please release PRs), and runs `gh pr merge --auto`
# only when the PR qualifies. The actual merge still waits on the consuming repo's
# own required status checks — see docs/consuming.md for the prerequisite that
# every consumer MUST require merge-safety + CI on the default branch first.

on:
  workflow_call:
    inputs:
      pr:
        description: PR number to classify + enable auto-merge for (threaded from the caller).
        type: string
        required: false
        default: ''
      version:
        description: >-
          Optional override of the @rmartz/bot-automerge version to install. Leave
          empty (the default) to install the release this workflow is pinned to —
          an explicit value is NOT tracked by Dependabot and will go stale.
        type: string
        required: false
        default: ''
      node-version:
        description: Node.js version to run under.
        type: string
        required: false
        default: '22'

permissions:
  contents: write # enable GitHub-native auto-merge on the PR
  pull-requests: write # read PR metadata + turn on auto-merge
  packages: read # install the CLI from GitHub Packages

concurrency:
  group: bot-automerge-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  enable:
    name: Enable auto-merge for an eligible bot PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      # GITHUB_REPOSITORY is always set in Actions; pass it to the CLI explicitly
      # because this job runs NO checkout, so cwd-based repo resolution would fail.
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://npm.pkg.github.com
          scope: '@rmartz'
      - name: Resolve @rmartz/bot-automerge version
        id: cli
        env:
          OVERRIDE: ${{ inputs.version }}
          WORKFLOW_REPO: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [ -n "${OVERRIDE}" ]; then
            version="${OVERRIDE}"
          else
            # The released version lives in the git tag, not in this file or in
            # package.json (semantic-release commits nothing back — see release.yml).
            # job.workflow_sha is the exact commit the consumer pinned (@<sha>), and
            # Dependabot only ever pins release-tag commits, so the version is the
            # release tag on that SHA. Both the current vX.Y.Z tags and the legacy
            # bot-automerge-vX.Y.Z tags resolve. --paginate output is captured (not
            # piped to head) so a closed pipe can't trip pipefail.
            tags="$(gh api --paginate \
              "repos/${WORKFLOW_REPO}/tags" \
              --jq ".[] | select(.commit.sha == \"${WORKFLOW_SHA}\") | .name")"
            version="$(printf '%s\n' "${tags}" \
              | sed -nE 's/^(bot-automerge-)?v([0-9]+\.[0-9]+\.[0-9]+)$/\2/p' \
              | sort -V | tail -n 1)"
            if [ -z "${version}" ]; then
              echo "::error::No release tag points at pinned commit ${WORKFLOW_SHA} in ${WORKFLOW_REPO}. Pin a release commit (Dependabot does this), or set the 'version:' input." >&2
              exit 1
            fi
          fi
          echo "Installing @rmartz/bot-automerge@${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Install ai-bot-automerge
        env:
          # The public @rmartz/bot-automerge package on GitHub Packages is readable
          # with the built-in GITHUB_TOKEN — no consumer PAT required.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLI_VERSION: ${{ steps.cli.outputs.version }}
        run: npm install -g "@rmartz/bot-automerge@${CLI_VERSION}"

      # A Dependabot PR carries a semver update-type; fetch it and pass it so the
      # CLI enables auto-merge only on patch/minor (majors stay manual). The guard
      # keys off the PR author, which is robust across opened/synchronize/labeled —
      # unlike github.actor, which can be a human who relabeled the PR.
      - name: Fetch Dependabot metadata
        id: metadata
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (Dependabot)
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: ai-bot-automerge enable --pr "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --update-type "${UPDATE_TYPE}"

      # Any other author (release-please or another bot) — the CLI detects
      # release-please itself and no-ops on anything it does not trust. No
      # update-type is passed on this path.
      #
      # This path enables auto-merge with a real-actor PAT (the consumer's
      # inherited RELEASE_PLEASE_PAT), NOT the job-level GITHUB_TOKEN. A
      # release-please release PR merged via GITHUB_TOKEN is attributed to
      # github-actions[bot], and GITHUB_TOKEN-attributed pushes do NOT trigger
      # workflows — so the consumer's `release.yml` (`on: push`) would never
      # re-fire and nothing would publish or tag. A PAT actor re-triggers it. Falls
      # back to github.token when no PAT is provided (auto-merge still works, but
      # release-PR CD won't re-trigger — see docs/consuming.md). Fixes #8.
      - name: Enable auto-merge (release-please / other bot)
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_PAT || github.token }}
        run: ai-bot-automerge enable --pr "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}"
