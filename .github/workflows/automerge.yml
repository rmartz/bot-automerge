name: automerge

# bot-automerge dogfoods its own eligibility enabler: this caller turns on
# GitHub-native auto-merge for THIS repo's trustworthy bot PRs — Dependabot
# patch/minor bumps and release-please release PRs. It pins the PUBLISHED reusable
# workflow by SHA (Dependabot-bumped), not a local `./` ref, so we exercise the
# exact path consumers do. The file is `automerge.yml` because `bot-automerge.yml`
# is the reusable definition this repo provides.
#
# `secrets: inherit` passes RELEASE_PLEASE_PAT through, so the release-please path
# merges via a real-actor PAT and re-triggers release.yml for continuous delivery
# (see docs/consuming.md §3). Auto-merge still waits on this repo's ruleset
# required checks (merge-safety + CI), so nothing merges until a PR is both
# eligible AND verified. Human-authored PRs are classified as not-eligible and
# left untouched.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: write # enable GitHub-native auto-merge on the PR
  pull-requests: write # read PR metadata + turn on auto-merge
  packages: read # install the CLI from GitHub Packages (reusable workflow needs it)

jobs:
  bot-automerge:
    uses: rmartz/bot-automerge/.github/workflows/bot-automerge.yml@139f4ce609c2dfe65f1e090c00f17204bfce1b3e # v0.1.1
    with:
      pr: ${{ github.event.pull_request.number }}
    secrets: inherit
