name: Release

# Automated releases via semantic-release. On every push to main it analyzes the
# Conventional-Commit history since the last `bot-automerge-v*` tag and, when a
# release is warranted, builds and publishes @rmartz/bot-automerge to npmjs
# (public), then creates the git tag + GitHub Release. It commits NOTHING back to
# the repo (no @semantic-release/git), so the built-in GITHUB_TOKEN suffices — no
# PAT. `tagFormat` is pinned to `bot-automerge-v${version}` in .releaserc.json for
# continuity with the prior release-please tags, so semantic-release resumes from
# bot-automerge-v0.1.1.
#
# npm auth is OIDC trusted publishing: npmjs trusts THIS workflow file
# (`release.yml`) in rmartz/bot-automerge, so there is no NPM_TOKEN secret.
# Renaming this file breaks publishing until the trusted publisher on npmjs is
# updated to match. Provenance attestations are generated automatically.

on:
  push:
    branches: [main]

# Serialize releases so two pushes can't publish concurrently.
concurrency: release

permissions:
  contents: write # create tags + GitHub Releases
  id-token: write # npm trusted publishing (OIDC) + provenance
  issues: write # semantic-release/github comments on released issues
  pull-requests: write # semantic-release/github comments on released PRs

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
