name: Release

# Automated releases via semantic-release, through the fleet's shared workflow
# (rmartz/semantic-release-ci). On every push to main it analyzes the
# Conventional-Commit history since the last `bot-automerge-v*` tag and, when a
# release is warranted, builds and publishes @rmartz/bot-automerge to npmjs
# (public), then creates the git tag + GitHub Release. It commits NOTHING back to
# the repo (no @semantic-release/git), so the built-in GITHUB_TOKEN suffices — no
# PAT. The release toolchain (semantic-release, its plugins incl.
# @semantic-release/exec, and the changelog preset) lives in semantic-release-ci,
# where a toolchain bump is tested before it reaches this pin; the options stay
# here in .releaserc.json (`tagFormat` is pinned to `bot-automerge-v${version}`
# there for continuity with the prior release-please tags).
#
# npm auth is OIDC trusted publishing: npmjs trusts THIS workflow file
# (`release.yml`) in rmartz/bot-automerge, so there is no NPM_TOKEN secret.
# Renaming this file breaks publishing until the trusted publisher on npmjs is
# updated to match. Provenance attestations are generated automatically. OIDC
# publishing needs npm >= 11.5.1: the shared workflow runs on Node 24 (npm 11)
# and, because this workflow grants `id-token: write`, fails before tagging if
# npm is older.
#
# The npm publish runs in semantic-release's `prepare` step (via
# @semantic-release/exec; @semantic-release/npm only writes the version, with
# npmPublish: false), because semantic-release pushes the git tag after `prepare`
# and before `publish`. Publishing in `publish` left bot-automerge-v1.0.0 as a tag
# with no package when npm failed. Publishing first means a failed publish aborts
# the release before any tag exists.

on:
  push:
    branches: [main]

# Serialize releases so two pushes can't publish concurrently.
concurrency: release

permissions:
  contents: write # create tags + GitHub Releases
  id-token: write # npm trusted publishing (OIDC) + provenance
  issues: write # semantic-release/github comments on released issues
  pull-requests: write # semantic-release/github comments on released PRs

jobs:
  release:
    uses: rmartz/semantic-release-ci/.github/workflows/semantic-release.yml@55b1f6145b85738f94ad87c12c9d4f41ab7818b4 # v2.0.0
    with:
      build-command: pnpm run build
