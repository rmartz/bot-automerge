version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # `fix` (not `chore`) so a dependency bump cuts a patch release —
      # conventional-commit `chore` bumps produce no release. This keeps the
      # published package version moving as action pins are updated.
      prefix: fix
      include: scope
    groups:
      # Every action bump, majors included, lands in one PR. bot-automerge holds
      # a group containing a major for human review (fetch-metadata reports the
      # group's highest update-type), and a major that breaks CI is split out into
      # its own fix PR rather than holding the rest of the group back.
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # `fix` (not `chore`) so a dependency bump cuts a patch release —
      # conventional-commit `chore` bumps produce no release.
      prefix: fix
      include: scope
    groups:
      # Prettier isolated into its own group so a reformatting bump can't hide in a
      # catch-all (a Prettier minor can reformat the whole tree).
      prettier:
        patterns:
          - 'prettier'
      dev-dependencies:
        dependency-type: development
        exclude-patterns:
          - 'prettier'
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
